apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "instagram-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "instagram-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instagram-mcp.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "instagram-mcp.selectorLabels" . | nindent 14 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 10080
          env:
            - name: PUBLIC_BASE_URL
              value: {{ required "publicBaseUrl is required" .Values.publicBaseUrl | quote }}
            - name: META_APP_ID
              value: {{ required "meta.appId is required" .Values.meta.appId | quote }}
            - name: META_GRAPH_VERSION
              value: {{ .Values.meta.graphVersion | quote }}
            {{- with .Values.meta.loginConfigId }}
            - name: META_LOGIN_CONFIG_ID
              value: {{ . | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: TOKEN_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: TOKEN_KEYS
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: META_APP_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
